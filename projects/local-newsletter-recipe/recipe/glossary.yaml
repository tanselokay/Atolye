# AiPulse translation glossary — source term (any language) -> preferred Turkish.
# Injected into the title-translation and critique prompts so the local model
# renders jargon consistently and never leaves terms half-English or concatenated.
# Extend freely; keys are matched case-insensitively as whole phrases.
terms:
  # semiconductors / hardware
  "mature node": "olgun düğüm"
  "process node": "üretim düğümü"
  "wafer": "pul (wafer)"
  "foundry": "döküm tesisi (foundry)"
  "chip": "çip"
  "fab": "fabrika (fab)"
  # robotics / edge
  "UAV": "İHA"
  "UAV swarm": "İHA sürüsü"
  "drone swarm": "dron sürüsü"
  "edge AI": "uç yapay zeka"
  "on-device": "cihaz üstü"
  "tactile": "dokunsal"
  # loanwords Turkish already spells the source way — the translator "helpfully"
  # respells them phonetically and invents non-words (2026-09-23: "DNA orijami")
  "origami": "origami"
  "DNA origami": "DNA origami"
  "plasmid": "plazmit"
  "scaffold": "iskele"
  # core ML
  "backpropagation": "geri yayılım"
  "inference": "çıkarım"
  "fine-tuning": "ince ayar"
  "pretraining": "ön eğitim"
  "quantization": "niceleme"
