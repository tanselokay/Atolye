  # synthetic media / AI law (added 2026-09-08)
  # No.51 shipped "derin sahte ve yapay zeka uyuşmazlıkları" — a word-for-word calque of
  # "deepfake" left as a BARE ADJECTIVE with no noun, then coordinated with a noun. Turkish
  # cannot join those, and Turkish tech media uses the loanword anyway (it appears 21 times
  # elsewhere in the archive). Nothing pinned the term, so the model invented a translation.
  "deepfake": "deepfake"
  "deepfakes": "deepfake içerikler"
  "deepfake video": "deepfake video"
  "synthetic media": "sentetik medya"
  "digital replica": "dijital kopya"
  "digital replicas": "dijital kopyalar"
  "algorithmic price discrimination": "algoritmik fiyat ayrımcılığı"
  # signal processing / statistics (added 2026-09-12)
  # No.55 rendered "Dynamic Coupling Index" as "Dinamik EŞLEŞME Endeksi". Eşleşme means
  # matching or pairing; coupling between signals is "bağlaşım".
  "coupling": "bağlaşım"
  "dynamic coupling": "dinamik bağlaşım"
  "correlation": "korelasyon"
  "time series": "zaman serisi"
  "heterogeneous": "heterojen"
